# Overlay: dùng CLI đã cài trong image + auth/credential từ host.
#
#   export HOST_HOME="$HOME"
#   export DEV_TEAM_PROJECT_PATH=/path/to/my-project
#   docker compose -f docker-compose.yml -f docker-compose.runners.yml up --build
#
# Claude auth trên Linux:
#   ~/.claude/.credentials.json   ← tên đúng (có dấu chấm)
#   ~/.claude.json                ← sibling của thư mục .claude
#
# Host mounts là :ro; entrypoint COPY vào /home/dashboard (uid 1001) để
# đọc được file mode 0600 mà không chown file trên host.
#
# Fallback: ANTHROPIC_API_KEY / CURSOR_API_KEY

services:
  dashboard:
    user: "0:0"
    environment:
      HOME: /home/dashboard
      USER: dashboard
      CLAUDE_CONFIG_DIR: /home/dashboard/.claude
      PATH: /home/dashboard/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      # Auth + plugins (read-only từ host)
      - ${HOST_HOME:?Set HOST_HOME to your user home}/.claude:/mnt/host-claude:ro
      - ${HOST_HOME}/.claude.json:/mnt/host-claude.json:ro
      - ${HOST_HOME}/.cursor:/mnt/host-cursor:ro
      # Dashboard credential profiles
      - ${HOST_HOME}/.dev-team-dashboard/credentials.json:/data/dashboard-home/credentials.json
