# Overlay: host Claude/Cursor auth + PUID/PGID (requires HOST_HOME in docker/.env).

services:
  dashboard:
    user: "0:0"
    environment:
      HOME: /home/dashboard
      CLAUDE_CONFIG_DIR: /home/dashboard/.claude
      PATH: /home/dashboard/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PUID: ${PUID:-1001}
      PGID: ${PGID:-1001}
      FIX_PROJECT_OWNERSHIP: ${FIX_PROJECT_OWNERSHIP:-0}
    volumes:
      - ${HOST_HOME:?Set HOST_HOME in docker/.env}/.claude:/mnt/host-claude:ro
      - ${HOST_HOME}/.claude.json:/mnt/host-claude.json:ro
      - ${HOST_HOME}/.cursor:/mnt/host-cursor:ro
      - ./.runtime/cursor-auth.json:/mnt/host-cursor-auth.json:ro
      - ${HOST_HOME}/.dev-team-dashboard/credentials.json:/data/dashboard-home/credentials.json
