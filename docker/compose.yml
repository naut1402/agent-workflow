# Dashboard standalone — build context = repo root.
# Env: docker/.env (see .env.example). DEV_TEAM_ROOT=/data/project/.dev-team-agent

name: agent-workflow

services:
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dev-team-dashboard:local
    ports:
      - "${DEV_TEAM_DASHBOARD_PORT:-5174}:5174"
    env_file:
      - path: .env
        required: false
    environment:
      DEV_TEAM_DASHBOARD_HOST: "0.0.0.0"
      DEV_TEAM_DASHBOARD_PORT: "${DEV_TEAM_DASHBOARD_PORT:-5174}"
      DEV_TEAM_ROOT: /data/project/.dev-team-agent
      DEV_TEAM_DASHBOARD_HOME: /data/dashboard-home
      HOME: /home/dashboard
      CLAUDE_CONFIG_DIR: /home/dashboard/.claude
      PUID: ${PUID:-1001}
      PGID: ${PGID:-1001}
      FIX_PROJECT_OWNERSHIP: ${FIX_PROJECT_OWNERSHIP:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - ${DEV_TEAM_PROJECT_PATH:-${HOME}/workspace}:/data/project
      - dashboard-home:/data/dashboard-home
    restart: unless-stopped

volumes:
  dashboard-home:
