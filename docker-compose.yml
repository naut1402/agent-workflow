services:
  dashboard:
    build: .
    ports:
      - "5174:5174"
    environment:
      DEV_TEAM_DASHBOARD_HOST: "0.0.0.0"
      DEV_TEAM_DASHBOARD_PORT: "5174"
      DEV_TEAM_DASHBOARD_HOME: "/data"
      DEV_TEAM_API_TOKEN: ${DEV_TEAM_API_TOKEN}
      DEV_TEAM_ENV: ${DEV_TEAM_ENV:-}
    volumes:
      - dashboard-home:/data
      - workspaces:/workspaces
      - keys:/keys:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5174/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  dashboard-home:
  workspaces:
  keys:

