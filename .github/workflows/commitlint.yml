# Commitlint trên nhánh phát hành `dev/x.y.z/main` và trên dòng test
# `test/**/main` (và PR target vào đó).
#
# Kiểm tra:
# - PR title (quan trọng khi squash-merge — subject commit cuối = title)
# - Mọi commit trong range base…head của PR
#
# Format: docs/agent-rules/git-pr.md §7 / commitlint.config.js

name: Commitlint

on:
  pull_request:
    branches:
      - 'dev/**/main'
      - 'test/**/main'

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      # Dòng test là cây orphan, KHÔNG có `package.json` / `commitlint.config.js`
      # — với base `test/**` thì toolchain phải lấy từ `main`, còn commit cần
      # lint thì fetch riêng.
      # ⚠️ Chỉ đảo ref cho dòng test. Ép `ref: main` cho cả PR vào `dev/**/main`
      # thì PR nào sửa `commitlint.config.js` cũng được lint bằng config cũ và
      # xanh, luật mới chỉ có hiệu lực sau khi merge lên `main` — im lặng, khó đoán.
      - uses: actions/checkout@v5
        with:
          ref: ${{ startsWith(github.base_ref, 'test/') && 'main' || '' }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch commit range của PR
        # Chỉ cần khi checkout đã bị đảo sang `main`: cây orphan không reachable
        # từ đó. PR dòng `dev/**` checkout đúng merge ref của PR nên đã có range.
        if: startsWith(github.base_ref, 'test/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Cây orphan không reachable từ `main` nên fetch-depth:0 ở trên không kéo về.
          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx commitlint

      - name: Lint commits in PR
        run: >
          bunx commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose
