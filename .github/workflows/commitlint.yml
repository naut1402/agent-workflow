# Commitlint trên nhánh phát hành `dev/x.y.z/main` và trên dòng test
# `test/**/main` (và PR target vào đó).
#
# Kiểm tra:
# - PR title (quan trọng khi squash-merge — subject commit cuối = title)
# - Mọi commit trong range base…head của PR
#
# Format: docs/agent-rules/git-pr.md §7 / commitlint.config.js

name: Commitlint

on:
  pull_request:
    branches:
      - 'dev/**/main'
      - 'test/**/main'

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      # Dòng test mang cây đầy của dòng source nên có `package.json` +
      # `commitlint.config.js` riêng — 🚫 không đảo ref sang `main` nữa.
      # ⚠️ Đảo ref là bẫy im lặng: PR nào sửa `commitlint.config.js` cũng được lint
      # bằng config CŨ và xanh, luật mới chỉ có hiệu lực sau khi merge lên `main`.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile


      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx commitlint

      - name: Lint commits in PR
        run: >
          bunx commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose
