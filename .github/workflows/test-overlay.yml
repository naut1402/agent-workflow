# CI của **dòng test** (`test/main`, `test/x.y.z/**`) và cổng phát hiện lệch pha
# của dòng source.
#
# Test code sống ở dòng branch riêng, source code ở dòng `dev/**`. Không commit
# nào chứa cả hai cây, nên workflow này ghép hai ref lại rồi mới chạy suite:
#
#   1. suy cặp ref (`.github/scripts/test-ref.ts`)
#   2. checkout ref source, rồi `git archive <sha-test> tests test-e2e | tar -x`
#      lên chính cây đó
#   3. chạy full suite trên cây đã ghép, rồi ghi **mốc** coverage + **neo** SHA
#
# Hai chiều kích hoạt, cùng một cây ghép:
#
#   test → source  (PR/push dòng test)   : test vừa đổi, source giữ nguyên
#   source → test  (push `dev/x.y.z/main`): source vừa đổi, test giữ nguyên
#
# Chiều thứ hai là cơ chế **phát hiện test lệch pha**: PR code merge vào dòng
# version sau khi test đã viết thì cặp (source mới, test cũ) phải được chạy lại
# ngay, chứ không đợi tới PR phát hành — lúc đó sửa đắt hơn nhiều.
#
# Chỉ liệt kê **đúng 2 path** khi archive: archive toàn cây sẽ để `.gitignore`
# và `reports/` của dòng test đè lên config gốc của dòng source.
#
# 🚫 Không `--pass-with-no-tests` cho suite unit ở đây: trên dòng test, "0 file
# test" là đỏ, không phải "đã xanh".
#
# Job `report` chỉ chạy trên `push` **của dòng test**: PR từ fork không có secret
# và không được phép ghi, còn chiều nghịch thì không có gì mới để ghi.

name: Test overlay CI

on:
  pull_request:
    branches:
      - 'test/**'
  push:
    branches:
      - 'test/main'
      - 'test/*/main'
      - 'dev/*/main'
    # ⚠️ VAN CHẶN VÒNG LẶP — đừng bỏ.
    #
    # Job `report` của chính workflow này push `reports/` trở lại dòng test. Khi
    # repo có `AUTO_MERGE_TOKEN` (PAT), push đó **kích lại** workflow này ⇒
    # report → overlay → report, chạy full suite mãi không dừng. Đã xảy ra thật:
    # 3 lượt liên tiếp cách nhau ~4,5 phút, mỗi lượt một suite đầy đủ.
    #
    # Trước khi có PAT thì `GITHUB_TOKEN` chặn vòng này (GitHub cố ý không cho nó
    # trigger workflow tiếp theo) — nhưng đó là van **ẩn**, mất ngay khi ai đó khai
    # secret. Van phải tường minh và không phụ thuộc token đang dùng là cái nào.
    #
    # 🚫 Không đổi `report` sang `github.token` để thay van này: token ở đó là để
    # **có quyền push** khi dòng test bị branch protection (D5 của epic). Hai việc
    # khác nhau — token là quyền, `paths-ignore` là vòng lặp.
    #
    # `reports/` là **đầu ra** của suite, không phải đầu vào, nên bỏ qua nó không
    # mất phủ: commit chỉ đụng `reports/` thì không có gì mới để chạy. Commit đụng
    # cả `reports/` và path khác **vẫn chạy** (đúng semantics của `paths-ignore`).
    # Sửa baseline bằng tay vẫn được gác: nó đi qua PR, mà `pull_request` ở trên
    # 🚫 không có `paths-ignore`.
    paths-ignore:
      - 'reports/**'

concurrency:
  group: test-overlay-${{ github.ref }}
  # PR thì cancel lượt cũ (đúng và tiết kiệm). Push thì KHÔNG: job `report` ghi
  # baseline rồi push về dòng test, bị giết giữa `commit` và `push` là mất lượt.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Mặc định chỉ đọc; job `report` tự nâng quyền của riêng nó.
permissions:
  contents: read

jobs:
  resolve:
    name: Resolve source ↔ test pair
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.refs.outputs.source }}
      test_ref: ${{ steps.refs.outputs.test_ref }}
      test_sha: ${{ steps.refs.outputs.test_sha }}
      version: ${{ steps.refs.outputs.version }}
      direction: ${{ steps.refs.outputs.direction }}
      skip: ${{ steps.refs.outputs.skip }}
      # Ghép theo taskID hay lùi về đầu dòng version — xem `pair-source.ts`.
      paired: ${{ steps.refs.outputs.paired }}
      pair_note: ${{ steps.refs.outputs.pair_note }}
    steps:
      # Checkout ref đang trigger — dòng test mang **cây đầy** của dòng source nên
      # nó có sẵn `.github/scripts/`.
      #
      # 🚫 KHÔNG `ref: main`: tooling dòng test (`test-ref.ts`, `coverage-gate.ts`)
      # chỉ lên `main` khi version mở nó được release. Trước lúc đó, lấy script từ
      # `main` cho `Module not found` — mà lỗi đó đọc ra như "cổng hỏng", không
      # phải "chưa tới lượt". Ref đang trigger luôn là ref vừa mang chính tooling ấy.
      - name: Checkout triggering ref (carries ref-resolve script)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve ref pair
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          # PR: `base_ref` là branch dòng test đang nhận merge.
          BASE_REF: ${{ github.base_ref }}
          # PR: `head_ref` là branch task dòng test — nơi DUY NHẤT mang `{taskID}`.
          # `base_ref` là `test/x.y.z/main`, không mang taskID nào.
          # 🚫 Không nội suy `${{ … }}` thẳng vào `run:` — tên branch do người mở PR đặt.
          HEAD_REF: ${{ github.head_ref }}
          # PR phải chạy đúng commit của PR, không phải đầu branch base.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Chiều nghịch (`direction=source`) không có `head_ref` ⇒ không ghép
          # theo taskID; giá trị mặc định ở đây là của chính nhánh đó.
          PAIRED=not-applicable
          NOTE='push vào dòng source — chiều nghịch, không ghép theo taskID'

          if [[ "$EVENT" == 'push' && "$REF_NAME" == dev/* ]]; then
            # Chiều nghịch: source vừa đổi, lấy đầu dòng test hiện có.
            DIRECTION=source
            SOURCE="$REF_NAME"
            TEST_REF="$(bun .github/scripts/test-ref.ts test "$REF_NAME")"
            TEST_SHA="$(git ls-remote origin "refs/heads/${TEST_REF}" | cut -f1)"
            if [[ -z "$TEST_SHA" ]]; then
              # Chưa ai viết test cho version này. Đây KHÔNG phải lỗi ở đây —
              # `release-test-gate.yml` mới là chỗ chặn cứng việc thiếu test.
              echo "skip=true" >> "$GITHUB_OUTPUT"
              {
                echo "### Bỏ qua — dòng test chưa tồn tại"
                echo ""
                echo "Source \`${SOURCE}\` vừa đổi, nhưng \`${TEST_REF}\` chưa có trên remote."
                echo "Chưa có gì để đối chiếu, nên lượt này không chạy suite."
                echo ""
                echo "⚠️ Đây **không** phải \"đã test và xanh\". Cổng chặn cứng nằm ở"
                echo "\`release-test-gate.yml\` (PR phát hành \`dev/x.y.z/main\` → \`main\`)."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            DIRECTION=test
            TEST_REF="$([[ "$EVENT" == 'pull_request' ]] && echo "$BASE_REF" || echo "$REF_NAME")"
            TEST_SHA="$([[ "$EVENT" == 'pull_request' ]] && echo "$PR_HEAD_SHA" || echo "$PUSH_SHA")"
            if [[ "$EVENT" == 'pull_request' ]]; then
              # Ghép với branch task dòng source cùng `{taskID}` khi branch đó CÒN
              # trên remote. Không ghép thì PR dòng test LUÔN đỏ tới khi PR code
              # merge — "đỏ vì chưa tới lượt" lẫn với "đỏ vì hỏng thật".
              PAIR_OUT="$(bun .github/scripts/pair-source.ts "$TEST_REF" "$HEAD_REF")"
              SOURCE="$(printf '%s\n' "$PAIR_OUT" | sed -n 's/^source=//p')"
              PAIRED="$(printf '%s\n' "$PAIR_OUT" | sed -n 's/^paired=//p')"
              NOTE="$(printf '%s\n' "$PAIR_OUT" | sed -n 's/^note=//p')"
            else
              SOURCE="$(bun .github/scripts/test-ref.ts source "$TEST_REF")"
              PAIRED=not-applicable
              NOTE='push vào đầu dòng test — luôn ghép với đầu dòng version'
            fi
          fi

          VERSION="$(bun .github/scripts/test-ref.ts version "$TEST_REF")"
          {
            echo "skip=false"
            echo "direction=$DIRECTION"
            echo "source=$SOURCE"
            echo "test_ref=$TEST_REF"
            echo "test_sha=$TEST_SHA"
            echo "version=$VERSION"
            echo "paired=$PAIRED"
            echo "pair_note=$NOTE"
          } >> "$GITHUB_OUTPUT"

          # Truy vết: đỏ ở đây phải nói được đã chạy cặp ref nào (test lệch pha
          # so với source là nguyên nhân số 1, và nó không đọc được từ log suite).
          {
            if [[ "$DIRECTION" == 'source' ]]; then
              echo "### Đối chiếu lệch pha — source vừa đổi"
              echo ""
              echo "Đỏ ở lượt này nghĩa là **test cũ không còn khớp source mới**, không phải test sai."
              echo "Xử lý: mở task sửa test trên dòng \`${TEST_REF}\`."
            else
              echo "### Cặp ref đang chạy"
            fi
            echo ""
            echo "| Vai trò | Ref |"
            echo "|---|---|"
            echo "| source | \`$SOURCE\` |"
            echo "| test | \`$TEST_REF\` @ \`$TEST_SHA\` |"
            echo "| Ghép theo | \`$PAIRED\` — $NOTE |"
            if [[ "$PAIRED" == 'taskid' ]]; then
              echo ""
              echo "⚠️ Lượt này chấm trên **branch task dòng source chưa merge**."
              echo "🚫 Không merge PR dòng test trước PR code đối ứng. Sau khi PR code merge (branch task"
              echo "bị xoá), chạy lại lượt này: nó tự ghép với \`dev/x.y.z/main\` (\`paired: no-match\`)"
              echo "— **đó** mới là lượt xanh có quyền merge."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  overlay:
    name: Suite on grafted tree
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      # Neo của lượt chạy — xem ghi chú ở step "Ghi SHA source của lượt chạy".
      source_sha: ${{ steps.src.outputs.sha }}
    steps:
      - name: Checkout ref source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0

      # ⚠️ Neo phải lấy ở ĐÂY, không lấy lại ở job `report`: `report` checkout
      # ref source trong workspace khác, nên nếu source vừa được push giữa hai
      # job thì neo ghi ra là commit CHƯA TỪNG chạy suite. Một lượt chạy phải
      # cho đúng một cặp (SHA source, SHA test).
      - name: Record source SHA of this run
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Overlay test tree
        env:
          TEST_SHA: ${{ needs.resolve.outputs.test_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$TEST_SHA"
          # Giai đoạn đệm: dòng source vẫn còn `tests/` tracked. Không dọn thì
          # file cũ sót lại và suite chạy trên cây lẫn hai phiên bản.
          rm -rf tests test-e2e
          git archive "$TEST_SHA" tests test-e2e | tar -x -C .
          test -d tests || { echo "::error::Ref test $TEST_SHA không có thư mục tests/ — dừng ngay ở bước ghép."; exit 1; }
          echo "Đã overlay $TEST_SHA — số file test:"
          find tests test-e2e -name '*.test.ts' -o -name '*.spec.ts' | wc -l

      # `reports/` sống ở dòng test, mà cây overlay chỉ mang `tests/`+`test-e2e/`.
      # Bước `Anchor status` ngay dưới cần file này để đọc **neo**.
      #
      # ⚠️ Phải dọn `reports/` của dòng source TRƯỚC: checkout source mang sẵn một
      # bản `coverage-baseline.json` **đóng băng** (commit ở Đợt 2), nên **neo**
      # trong đó cũng là neo cũ — đọc nó ra là kết luận về một cây khác.
      - name: Fetch baseline (anchor + coverage mark) from test line
        id: baseline
        env:
          TEST_SHA: ${{ needs.resolve.outputs.test_sha }}
        run: |
          set -euo pipefail
          rm -rf reports
          if git archive "$TEST_SHA" reports | tar -x -C .; then
            echo "allow_missing=" >> "$GITHUB_OUTPUT"
          else
            # Lượt đầu của một dòng test: chưa có neo nào để đọc. Cho qua ở đây
            # (job `report` ngay sau sẽ ghi mốc + neo đầu tiên), nhưng phải nói ra.
            # Ở `release-test-gate.yml` thì trường hợp này là ĐỎ.
            echo "::warning::Dòng test $TEST_SHA chưa có reports/ — lượt này khởi tạo mốc + neo thay vì đọc neo cũ."
            echo "allow_missing=--allow-missing" >> "$GITHUB_OUTPUT"
          fi

      # Báo cáo, 🚫 KHÔNG gate. `test-anchor.ts` vốn chỉ chạy ở cổng PR phát hành,
      # nên neo lệch dòng version chỉ lộ ra ở đó — tức ở PR phát hành, lúc sửa đắt
      # nhất. Chạy ở đây = lệch neo hiện ra ngay trong MỘT lượt CI của dòng test.
      #
      # Đặt trước typecheck để vẫn in ra khi suite đỏ; `continue-on-error` để cả
      # verdict `anchor-gone` (exit 1) cũng không biến bước báo cáo thành cổng.
      #
      # 🚫 KHÔNG `if: always()`: `continue-on-error` đã đủ để không gate, còn
      # `always()` thì chạy cả khi chưa có baseline để đọc — đúng lượt khởi tạo một
      # dòng version mới — và `test:anchor` exit 2 ở đó, tức UI hiện một ❌ nhiễu
      # ngay lượt đầu của mỗi dòng. Có baseline thì mới có neo để báo cáo.
      - name: Anchor status (report only)
        if: steps.baseline.outputs.allow_missing == ''
        continue-on-error: true
        env:
          SOURCE_REF: ${{ needs.resolve.outputs.source }}
        run: |
          bun run test:anchor -- --baseline reports/coverage-baseline.json \
            --head-sha "$(git rev-parse HEAD)" --head-ref "$SOURCE_REF"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (vue-tsc)
        run: bun run typecheck

      - name: Lint (ESLint)
        run: bun run lint

      - name: Unit + integration tests (backend, bun test) + coverage
        run: bun run test -- --coverage --coverage-reporter=lcov --coverage-dir=coverage/backend

      - name: Unit tests (frontend, vitest) + coverage
        run: bun run test:fe

      - name: Build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E tests (playwright)
        run: bun run test:e2e

      # 🚫 KHÔNG có bước cổng coverage ở đây. Mức phủ thôi không gác merge từ
      # 2026-09-11 (`docs/agent-rules/testing.md` §6): nợ test được gác theo TASK ở
      # `release-test-gate.yml` (`test:status --strict`), còn phần trăm chỉ được
      # **ghi lại** ở job `report` dưới đây. 🚫 Đừng thêm lại một bước theo %.

      # Cổng thứ tự merge (`git-pr.md` §4.3). Đặt SAU toàn bộ suite nên 🚫 không
      # che kết quả nào: các bước trên đã chạy xong và đã ghi summary,
      # lượt này vẫn dùng được để viết test. Nó chỉ chặn đúng một việc — merge PR
      # dòng test trước PR code đối ứng.
      #
      # Đỏ ở đây 🚫 KHÔNG phải "đỏ mất tín hiệu": có đúng MỘT nguyên nhân và nêu
      # thẳng việc phải làm. Không có nó thì tín hiệu duy nhất là khối chữ ở job
      # summary, mà repo hiện không có branch protection nào ⇒ ghép cặp sẽ biến
      # "đỏ nhưng vẫn merge" thành "xanh rồi merge", dễ xảy ra hơn chứ không khó hơn.
      - name: Merge order guard — paired with unmerged source
        if: needs.resolve.outputs.paired == 'taskid'
        env:
          PAIR_NOTE: ${{ needs.resolve.outputs.pair_note }}
        run: |
          echo "::error::Lượt này chấm trên branch task dòng source CHƯA MERGE ($PAIR_NOTE). Suite ở trên đã chạy và kết quả vẫn đọc được, nhưng 🚫 không merge PR dòng test trước PR code: merge PR code, rồi chạy lại lượt này để có 'Ghép theo: no-match' — đó mới là lượt có quyền merge (git-pr.md §4.3)."
          exit 1

      - name: Upload coverage & reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-evidence-${{ needs.resolve.outputs.version }}-${{ github.run_id }}
          path: |
            coverage/
            playwright-report/
          if-no-files-found: ignore
          # Bằng chứng phải sống đủ lâu để dùng khi review PR phát hành của cả
          # dòng version, không chỉ trong lúc PR test còn mở. Bản nặng lâu dài
          # đi Release asset ở job `report`.
          retention-days: 90

  report:
    name: Push coverage to test line
    # Cả hai chiều push đều ghi neo, nhờ đó `source_sha` luôn khớp head dòng
    # version. PR bị loại vì fork không có secret để push.
    #
    # 🚫 Cố ý KHÔNG `if: always()`. Neo (`source_sha`/`test_sha`) trả lời đúng một
    # câu: **suite đã xanh trên cây nào**. Ghi neo từ một lượt suite đỏ là khai sai
    # đúng cái nó tồn tại để khai — `test-anchor` sẽ in `match` cho một cây suite
    # chưa từng xanh trên, biến `SHA anchor gate` của PR phát hành thành con dấu.
    #
    # Từ 2026-09-11 mức phủ 🚫 không còn là cổng (`testing.md` §6), nên cũng không
    # còn "vòng khoá baseline" nào để gỡ bằng `always()`: lượt đỏ đơn giản là chưa
    # có số và chưa có cây xanh để neo.
    if: github.event_name == 'push'
    needs: [resolve, overlay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Hai push cùng branch không được ghi đè nhau — xếp hàng, không cancel.
    concurrency:
      group: test-reports-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout ref source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source }}
          fetch-depth: 0

      # ⚠️ Cây riêng, KHÔNG commit từ cây overlay: cây overlay chịu `.gitignore`
      # của dòng source (có `coverage/`), `git add` từ đó trượt im lặng.
      - name: Checkout test line into separate dir
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.test_ref }}
          path: testline
          fetch-depth: 0
          token: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Lấy lại coverage của job `overlay` thay vì chạy suite lần hai — cùng một
      # lượt chạy thì phải cùng một con số, và chạy lại còn tốn gấp đôi.
      - name: Download coverage from overlay job
        uses: actions/download-artifact@v6
        with:
          name: test-evidence-${{ needs.resolve.outputs.version }}-${{ github.run_id }}

      - name: Update baseline + history
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_REF: ${{ needs.resolve.outputs.source }}
          TEST_REF: ${{ needs.resolve.outputs.test_ref }}
          # Neo SHA: thứ duy nhất cho `test-anchor.ts` biết baseline này đo trên
          # cây nào. Tên branch thì di chuyển, SHA thì không.
          SOURCE_SHA: ${{ needs.overlay.outputs.source_sha }}
          TEST_SHA: ${{ needs.resolve.outputs.test_sha }}
        run: |
          set -euo pipefail
          mkdir -p "testline/reports/${VERSION}"
          cp coverage/frontend/coverage-summary.json "testline/reports/${VERSION}/coverage-summary.json"
          # `--allow-missing`: dòng test vừa dựng chưa có `reports/` thì lượt xanh
          # ĐẦU TIÊN tự khởi tạo mốc + neo, thay vì exit 1. 🚫 Không làm mất cổng nào —
          # điều kiện "dòng test chưa có `reports/`" ở PR phát hành vẫn chặn, nó đọc
          # file **đã commit** trên dòng test chứ không đọc cây tạm của lượt này.
          bun run coverage:gate -- --update --allow-missing \
            --baseline "testline/reports/coverage-baseline.json" \
            --history "testline/reports/coverage-history.md" \
            --source-ref "$SOURCE_REF" \
            --test-ref "$TEST_REF" \
            --source-sha "$SOURCE_SHA" \
            --test-sha "$TEST_SHA"

      - name: Commit + push light layer
        working-directory: testline
        env:
          TEST_REF: ${{ needs.resolve.outputs.test_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "Không có thay đổi report — bỏ qua."
            exit 0
          fi
          git commit -m "chore(reports): cập nhật coverage ${TEST_REF}"
          # Chịu được race giữa hai job report của cùng dòng test.
          git pull --rebase origin "$TEST_REF"
          git push origin "HEAD:${TEST_REF}"

      # Evidence nặng đi Release asset — không có `retention-days`, và không làm
      # phình repo (một lượt chạy ~7,7 MB nén so với ~3,5 MB toàn bộ history).
      - name: Upload heavy evidence to Release asset
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          TEST_REF: ${{ needs.resolve.outputs.test_ref }}
        run: |
          set -euo pipefail
          TAG="reports-${VERSION}"
          ASSETS=()
          if [[ -d coverage ]]; then
            tar -czf coverage.tgz coverage
            ASSETS+=(coverage.tgz)
          fi
          if [[ -d playwright-report ]]; then
            tar -czf playwright-report.tgz playwright-report
            ASSETS+=(playwright-report.tgz)
          fi
          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "Không có evidence nào để đẩy — bỏ qua." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" \
                 --draft --title "Test evidence ${VERSION}" \
                 --notes "Bằng chứng test của dòng \`${TEST_REF}\`. Sinh tự động bởi CI."
          gh release upload "$TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" --clobber
          echo "Evidence: $(gh release view "$TAG" --repo "${{ github.repository }}" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
