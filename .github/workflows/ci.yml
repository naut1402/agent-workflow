# CI của **dòng source** (`main`, `dev/**`, `refactor/**`, mọi PR).
#
# Tách hai job theo ngữ cảnh, để cùng một file phục vụ được cả trước và sau khi
# `tests/` bị cắt khỏi dòng source:
#
#   code — typecheck · lint · build. Không cần cây test, luôn chạy.
#   full — suite test. Chỉ chạy khi cây test **có mặt** trong checkout.
#
# Vì sao dò cây test thay vì `--pass-with-no-tests`: `bun test <thư-mục-không-
# tồn-tại>` và `vitest run` không tìm thấy test đều exit 1. Nới thành "rỗng là
# xanh" sẽ làm mất luôn tác dụng của cổng ở dòng test, nơi rỗng **phải** là đỏ.
#
# Sau khi cắt: job `full` skip với trạng thái nhìn thấy được trên PR, và việc
# chạy test chuyển hẳn sang `test-overlay.yml` (PR dòng test) +
# `release-test-gate.yml` (PR phát hành).

name: CI

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
    # Dòng test có CI riêng (`test-overlay.yml`) chấm trên cây GHÉP. Ở đây cây là
    # bản sao `src/` do `sync-source-to-test.yml` đẩy sang, nên typecheck/lint/build
    # chấm sai cây (`testing.md` §3.1) và job `full` chạy lại nguyên suite lần hai.
    # ⚠️ Bật branch protection cho `test/*/main` thì check bắt buộc phải là
    # `Suite on grafted tree`, 🚫 không được có check của file này — sau thay đổi
    # này nó không chạy ở PR dòng test nữa nên sẽ treo mãi.
    branches-ignore:
      - 'test/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    outputs:
      has_tests: ${{ steps.probe.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Báo cáo, không gate: ngưỡng cứng báo oan với file nhỏ và file mở đầu bằng
      # docblock dài. Người duyệt tự đọc số. Rule: coding-guideline.md §7.
      - name: Comment ratio of changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          {
            echo "## Comment ratio — file đổi trong PR"
            echo ""
            echo "| File | Comment | Dòng code | Tỉ lệ |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # ⚠️ `|| true`: PR không có file `.ts/.vue/.sh/.yml` nào (vd PR chỉ đụng
          # `reports/` do job `report` sinh ra) làm `grep` exit 1, mà `pipefail`
          # + `set -e` giết cả bước TRƯỚC khi kịp typecheck. Nó nuốt luôn exit 2
          # (lỗi thật của `grep`) — giá chấp nhận được vì bước này chỉ **báo cáo**,
          # không gate; 🚫 đừng copy mẫu này sang bước có gate.
          git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" \
            | { grep -E '\.(ts|vue|sh|yml)$' || true; } \
            | while read -r f; do
                [[ -f "$f" ]] || continue
                tot="$(grep -cve '^[[:space:]]*$' "$f" || true)"
                [[ "${tot:-0}" -lt 20 ]] && continue
                cm="$(grep -cE '^[[:space:]]*(#|//|\*|/\*)' "$f" || true)"
                echo "| \`$f\` | $cm | $tot | $((cm * 100 / tot))% |" >> "$GITHUB_STEP_SUMMARY"
              done

          { echo ""; echo "Nền repo ~10–20%. Cao hơn nhiều thì soát lại theo \`coding-guideline.md\` §7."; } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Probe test tree in checkout
        id: probe
        run: |
          set -euo pipefail
          if [[ -d tests && -f tests/runners.json ]]; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Suite test: không chạy ở đây"
              echo ""
              echo "Ref này không có cây test — test sống ở dòng \`test/**\`."
              echo "Suite được chạy bởi \`test-overlay.yml\` (PR dòng test) và"
              echo "\`release-test-gate.yml\` (PR phát hành \`dev/x.y.z/main\` → \`main\`)."
              echo ""
              echo "⚠️ Đây **không** phải \"đã test và xanh\"."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Typecheck (vue-tsc)
        run: bun run typecheck

      - name: Lint (ESLint)
        run: bun run lint

      - name: Build
        run: bun run build

  full:
    name: Test suite (test tree present)
    needs: code
    if: needs.code.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit + integration tests (backend, bun test) + coverage
        run: bun run test -- --coverage --coverage-reporter=lcov --coverage-dir=coverage/backend

      - name: Unit tests (frontend, vitest) + coverage
        run: bun run test:fe

      # 🚫 Cố ý KHÔNG có bước `Build` ở job này: job `code` đã build mọi PR, và
      # `playwright.config.ts` tự chạy `bun run build` trong `webServer.command`.
      # Thêm bước build ở đây là lần build thứ ba cho cùng một PR — đi ngược mục
      # tiêu "giảm chi phí mỗi PR" của chính việc tách dòng test.
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E tests (playwright)
        run: bun run test:e2e

      # 🚫 Cố ý KHÔNG gác gì theo coverage ở đây — và từ 2026-09-11 thì 🚫 KHÔNG
      # ở đâu cả: mức phủ không còn là cổng (`docs/agent-rules/testing.md` §6), nợ
      # test gác theo TASK ở `release-test-gate.yml`. Gác theo % ở PR feature còn
      # chặn mọi PR thêm source trước khi test kịp viết — đúng cái vòng phụ thuộc
      # mà việc tách dòng test đang muốn phá.
      - name: Upload coverage & reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-evidence
          path: |
            coverage/
            playwright-report/
          if-no-files-found: ignore
          # Bằng chứng phải còn sống khi review PR phát hành của cả dòng version,
          # không chỉ trong tuần mở PR feature.
          retention-days: 90
