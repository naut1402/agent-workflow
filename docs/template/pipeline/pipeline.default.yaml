version: 1

defaults:
  review_retry_max: 2
  auto_review: false
  export_json: false

steps:
  - id: investigator
    name: Investigate
    agent: dev-agent-teams:investigator
    skills: [survey-codebase]
    rule_category: doc-writing
    rule_required: true
    produces: [investigate.md]
    knowledge_inputs: []
    export_key: investigator
    hitl:
      mode: manual
      gate_id: hitl-1
      optional_doc_review: true

  - id: designer
    name: Design
    agent: dev-agent-teams:designer
    skills: [write-design]
    rule_category: doc-writing
    rule_required: true
    produces: [design.md]
    export_key: designer
    hitl:
      mode: manual
      gate_id: hitl-2
      optional_doc_review: true

  - id: implementer
    name: Implement
    agent: dev-agent-teams:implementer
    skills: [coding-rules, run-phpstan]
    rule_category: coding
    rule_required: false
    rule_fallback_skill: coding-rules
    produces: [phpstan.md]
    export_key: implementer
    hitl:
      mode: none

  - id: reviewer
    name: Review
    agent: dev-agent-teams:reviewer
    skills: [coding-rules, write-tests]
    rule_category: [coding, test]
    rule_required: false
    rule_fallback_skill: coding-rules
    produces: [review.md, test-spec.md]
    export_key: reviewer
    hitl:
      mode: manual
      gate_id: hitl-3
      blocking: true
      retry:
        on: must_fix
        restart_from: implementer
        max: 2

  - id: pr-creator
    name: PR
    agent: dev-agent-teams:pr-creator
    skills: [create-pr]
    rule_category: git-pr
    rule_required: false
    rule_fallback_skill: create-pr
    produces: [pr-desc.md]
    export_key: pr_creator
    hitl:
      mode: none

doc_reviewer:
  agent: dev-agent-teams:doc-reviewer
  skills: [doc-review]
  rule_category: doc-review
  rule_required: true
